# Single source of pack id -> carrier pair (API-3, SYS-6, AIR-5). MHz. ADR-0015 (#80, #76), ADR-0016 (#26, #89).
# region sets the pack power limit (SYS-5, AIR-6): UK = EN 300 328 non-adaptive, < 10 dBm EIRP; US = FCC 15.247.
# Rules (host/channel_plan.py): every carrier >= 3 MHz from every other (2 Mbit GFSK, bsim #76); fB >= fA + 40;
# 8 gap carriers clear of Wi-Fi 1/6/11 (2423 2426 | 2448 2451 | 2473 2476 2479 2482), one per pack.
# 2482 is UK/EU only (EN 300 328 OBW and OOB checked in audit.py Audit 5); the US plan is channel_plan_us.yaml.
# Near-far: whichever pack is near an antenna, every other pack keeps one carrier >= 5 MHz from both of its carriers.
# UK venues may also run Wi-Fi 13 (2462-2482): then 2473/2476/2479/2482 are lost and packs 1, 6-8 lose their gap copy.
region: UK
packs:
  1: {fA: 2414, fB: 2482}
  2: {fA: 2423, fB: 2463}
  3: {fA: 2426, fB: 2468}
  4: {fA: 2403, fB: 2448}
  5: {fA: 2408, fB: 2451}
  6: {fA: 2429, fB: 2473}
  7: {fA: 2434, fB: 2476}
  8: {fA: 2439, fB: 2479}
