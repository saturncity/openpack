# WLAN interference parameters for the bsim twin (issue #16, ADR-0003).
# Used until a venue scan exists. Each param: value, unit, source, estimate (true = engineering estimate,
# not a literature number). Maps to BabbleSim 2G4_device_WLAN_actmod options AND audit.py burst_loss().
# Honest limit: no primary source gives one "busy fraction for a packed auditorium"; busy values are
# estimates bracketed by the sources in `sources`. Replace from a venue scan (Phase 1+).
# actmod values are calibrated so AIR-1 packet loss in bsim equals busy_fraction (#18, tests/bsim/probe/run.sh,
# one 3000-packet run per carrier). Gap carriers 2424/2449/2473 stay <= 0.006 loss at every ConfigSet.
sources:
  actmod: https://github.com/BabbleSim/ext_2G4_device_WLAN_actmod   # options: src/WLAN_actmod_argparse.c, docs/Description.pdf
  hou2021: https://doi.org/10.1109/ACCESS.2021.3088123   # Hou et al., IEEE Access 9, railway-station 2.4/5 GHz busy/idle durations, heavy WLAN traffic
  ieee80211: https://standards.ieee.org/ieee/802.11/7028/   # IEEE 802.11-2020: aPPDUMaxTime 5.484 ms, channels 1/6/11 non-overlapping
  fcc: https://www.ecfr.gov/current/title-47/section-15.247   # 47 CFR 15.247: max 30 dBm conducted in 2.4 GHz
  audit: audit.py   # burst_loss() Gilbert-Elliott: busy 0.10 "clear", 0.40 "worst case", mean burst 2-4 frames
scenario:   # ADR-0003
  interferers: 3            # laptop + 2 phones, iperf
  wifi_channels: [1, 6, 11] # one interferer device per channel
  interferer_distance_m: 2  # to receiver antenna
  pack_distance_m: 10
  source: docs/adr/0003-pass-numbers.md
  estimate: false
sets:
  typical_crowded_venue:
    gilbert_elliott:        # audit.py burst_loss(busy, mean_burst_frames)
      busy_fraction:      {value: 0.10, unit: fraction of time per BLE channel, source: "audit.py clear-channel case; bracketed by hou2021 (heavy-traffic 2.4 GHz channels, non-rush)", estimate: true}
      mean_burst_frames:  {value: 2, unit: audio frames, source: "ieee80211 (typical aggregate PPDU <= 5.484 ms) vs audit.py", estimate: true}
    actmod:                 # per interferer device, one per Wi-Fi channel
      ConfigSet:          {value: 10, unit: "-ConfigSet=10", source: "calibrated #18: AIR-1 packet loss on in-band carriers 2437/2442 = 0.105/0.087 (target busy 0.10)", estimate: false}
      DataRate:           {value: 54, unit: Mbit/s, source: "set by ConfigSet 10", estimate: false}
      pr:                 {value: 0.35, unit: probability, source: "set by ConfigSet 10 (new packet right after tx)", estimate: false}
      sigma:              {value: 4, unit: ms, source: "set by ConfigSet 10, generalized-Pareto scale", estimate: false}
      kappa:              {value: 0, unit: shape, source: "set by ConfigSet 10", estimate: false}
      power:              {value: 15, unit: dBm, source: "phone/laptop typical 14-20 dBm EIRP, under fcc 30 dBm cap", estimate: true}
  worst_case_iperf:
    gilbert_elliott:
      busy_fraction:      {value: 0.40, unit: fraction of time per BLE channel, source: "audit.py worst case; ADR-0003 phase-1 busy fraction", estimate: true}
      mean_burst_frames:  {value: 4, unit: audio frames, source: "ieee80211 aPPDUMaxTime 5.484 ms A-MPDU; audit.py 4 ms case", estimate: false}
    actmod:
      ConfigSet:          {value: 50, unit: "-ConfigSet=50 -sigma=0.9 (sigma overrides the set's 0.45)", source: "calibrated #18: AIR-1 packet loss on 2437/2442 = 0.398/0.395 (target busy 0.40); plain ConfigSet 50 gives 0.56, 100 gives 0.95 (hard stress)", estimate: false}
      DataRate:           {value: 54, unit: Mbit/s, source: "set by ConfigSet 50", estimate: false}
      pr:                 {value: 0.55, unit: probability, source: "set by ConfigSet 50", estimate: false}
      sigma:              {value: 0.9, unit: ms, source: "calibrated #18 (ConfigSet 50 default 0.45)", estimate: false}
      kappa:              {value: 0, unit: shape, source: "set by ConfigSet 50", estimate: false}
      power:              {value: 20, unit: dBm, source: "actmod default 20 dBm; within fcc 30 dBm cap", estimate: false}
