name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y ngspice
      - run: pip install pytest pytest-timeout 'schemathesis>=4,<5' numpy pyyaml -r host/requirements.txt cadquery trimesh rtree skidl==3.0.0
      - run: python3 audit.py
      - run: |
          pytest -q -rP || [ $? -eq 5 ]
      # hw/pack/pack.py build() regenerates these; a diff means the committed copies are stale
      - run: git diff --exit-code hw/pack/openpack.kicad_sym hw/pack/out/bom.csv
  # enabled in phase 2
  twister:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "twister skipped until phase 2"
  # enabled in phase 2
  bsim:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "bsim skipped until phase 2"
  # pack PCB (#34): DRC 0 errors against hw/pack/pack.kicad_dru, fab outputs regenerate identically, fit
  pcb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kicad python3-pytest
      - run: kicad-cli version
      - run: python3 -m pytest -q -rP tests/test_pack_layout.py
