name: fw
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"  # nightly: G2 (d) RX-7 for 1 simulated hour (#27)

jobs:
  bsim:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ghcr.io/zephyrproject-rtos/ci-repo-cache:v0.29.4.20260912
      options: --entrypoint /bin/bash
    env:
      ZEPHYR_TOOLCHAIN_VARIANT: zephyr
      BSIM_OUT_PATH: ${{ github.workspace }}/tools/bsim
      BSIM_COMPONENTS_PATH: ${{ github.workspace }}/tools/bsim/components
    steps:
      - uses: actions/checkout@v4
        with:
          path: openpack
      - uses: actions/cache@v4
        with:
          path: |
            zephyr
            modules
            bootloader
            tools
          key: west-${{ hashFiles('openpack/west.yml') }}
      - name: west update
        run: |
          git config --global --add safe.directory '*'
          [ -d .west ] || west init -l openpack
          west update --narrow -o=--depth=1
          west list | head -40
      - name: build BabbleSim
        working-directory: tools/bsim
        run: make everything -s -j4
      - name: coverage inventory
        run: |
          echo "== devices"; ls "$BSIM_OUT_PATH"/bin/bs_*device* "$BSIM_OUT_PATH"/bin/bs_2G4_phy*
          echo "== channels/modems"; ls "$BSIM_OUT_PATH/lib"
          echo "== impl status (RADIO, UART, TIMER, DPPI, RTC, GPIOTE, IPC, I2S, CLOCK)"
          grep -iE '^\| \*\*(RADIO|UART|TIMER|DPPI|RTC|GPIOTE|IPC|I2S|CLOCK|PDM)' modules/bsim_hw_models/nrf_hw_models/docs/README_impl_status.md | cut -c1-140
          echo "== nrf_hw_models revision"; west list -f '{name} {revision}' nrf_hw_models babblesim_ext_2G4_device_WLAN_actmod
      - name: build probes
        run: |
          find /opt/toolchains -maxdepth 1 || true
          export ZEPHYR_SDK_INSTALL_DIR="${ZEPHYR_SDK_INSTALL_DIR:-$(find /opt/toolchains -maxdepth 1 -name 'zephyr-sdk-*' | head -1)}"
          echo "SDK=$ZEPHYR_SDK_INSTALL_DIR"
          B=nrf5340bsim/nrf5340/cpunet
          west build -p -b "$B" openpack/tests/bsim/probe/radio -d b_tx --no-sysbuild -- -DCONFIG_PROBE_ROLE_TX=y
          west build -p -b "$B" openpack/tests/bsim/probe/radio -d b_rx --no-sysbuild
          west build -p -b nrf5340bsim/nrf5340/cpuapp openpack/tests/bsim/probe/uart -d b_uart --no-sysbuild
          cp b_tx/zephyr/zephyr.exe "$BSIM_OUT_PATH/bin/bs_probe_tx"
          cp b_rx/zephyr/zephyr.exe "$BSIM_OUT_PATH/bin/bs_probe_rx"
          cp b_uart/zephyr/zephyr.exe "$BSIM_OUT_PATH/bin/bs_probe_uart"
      - name: uart -> pty
        timeout-minutes: 3
        run: openpack/tests/bsim/probe/uart.sh
      - name: protocol over pty (PK-9, PK-10, RX-9, #25)
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: |
          export ZEPHYR_SDK_INSTALL_DIR="${ZEPHYR_SDK_INSTALL_DIR:-$(find /opt/toolchains -maxdepth 1 -name 'zephyr-sdk-*' | head -1)}"
          pip install pytest pytest-timeout pyserial pyyaml -r openpack/host/requirements.txt
          west build -p -b nrf5340bsim/nrf5340/cpuapp openpack/fw -d b_proto_pack --sysbuild
          west build -p -b nrf5340bsim/nrf5340/cpuapp openpack/fw -d b_proto_rx --sysbuild -- -DSB_CONFIG_OP_ROLE_RX=y
          FW_PACK_EXE=$PWD/b_proto_pack/fw/zephyr/zephyr.exe FW_RX_EXE=$PWD/b_proto_rx/fw/zephyr/zephyr.exe \
            pytest -q openpack/tests/bsim/proto
          # G3 (#30): the FastAPI host against bsim receiver ptys, incl. a receiver reset
          FW_RX_EXE=$PWD/b_proto_rx/fw/zephyr/zephyr.exe pytest -q openpack/tests/bsim/host
      - name: radio probe (no Wi-Fi), expect zero loss
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: |
          openpack/tests/bsim/probe/run.sh none | tee none.txt
          [ "$(grep -c 'loss=0.000' none.txt)" = 5 ]
      - name: radio probe, Wi-Fi calibration (wlan_params.yaml)
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: |
          check() { # target, run.sh args: in-band 2437 loss within +-0.04 of target
            openpack/tests/bsim/probe/run.sh "${@:2}" | tee cal.txt
            grep 'freq=2437' cal.txt | grep -o 'loss=[0-9.]*' | cut -d= -f2 |
              awk -v t="$1" '{d=$1-t; if (d<0) d=-d; exit !(d<=0.04)}'
          }
          check 0.10 10 -power=15
          check 0.40 50 -sigma=0.9
      - name: "pack frame schedule (AIR-4, #22) + app-core stress (FW-2, #87), 10 s each"
        if: ${{ !cancelled() }}
        timeout-minutes: 12
        run: |
          export ZEPHYR_SDK_INSTALL_DIR="${ZEPHYR_SDK_INSTALL_DIR:-$(find /opt/toolchains -maxdepth 1 -name 'zephyr-sdk-*' | head -1)}"
          pip install -q numpy  # check.py: payloads vs sim/codec/codec.py
          west build -p -b nrf5340bsim/nrf5340/cpuapp openpack/fw -d b_fw --sysbuild
          openpack/tests/bsim/sched/run.sh b_fw/fw/zephyr/zephyr.exe 10 | tee sched.txt
          grep -q 'SCHED_CHECK.*PASS' sched.txt
          # #87: the 50 ms console poll that exposed it, plus a thread above the frame thread waking
          # every 1 ms for 80 us (inside the 100 us frame lead): still no skip, no repeat.
          west build -p -b nrf5340bsim/nrf5340/cpuapp openpack/fw -d b_stress --sysbuild -- \
            -Dfw_CONFIG_OP_TEST_PROTO_POLL_MS=50 -Dfw_CONFIG_OP_TEST_APP_LOAD_PERIOD_US=1000 \
            -Dfw_CONFIG_OP_TEST_APP_LOAD_BUSY_US=80 -Dfw_CONFIG_OP_TEST_APP_LOAD_PRIO=-3
          openpack/tests/bsim/sched/run.sh b_stress/fw/zephyr/zephyr.exe 10 | tee sched_stress.txt
          grep -q 'SCHED_CHECK.*seq_skips=0 repeats=0 .*PASS' sched_stress.txt
      - name: "pack frame lead loop (#97, ADR-0022): +0.371 / +-40 ppm frame clock, 300 s per PR, 1 h nightly"
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        env:
          LEAD_SECS: ${{ github.event_name == 'schedule' && '3600' || '300' }}
        run: |
          export ZEPHYR_SDK_INSTALL_DIR="${ZEPHYR_SDK_INSTALL_DIR:-$(find /opt/toolchains -maxdepth 1 -name 'zephyr-sdk-*' | head -1)}"
          [ -x b_fw/fw/zephyr/zephyr.exe ] || west build -p -b nrf5340bsim/nrf5340/cpuapp openpack/fw -d b_fw --sysbuild
          for ppb in 371 40000 -40000; do
            openpack/tests/bsim/sched/lead.sh b_fw/fw/zephyr/zephyr.exe "$LEAD_SECS" "$ppb" >"lead_$ppb.txt" 2>&1 &
          done
          # negative control: loop open at -40 ppm slips within seconds
          openpack/tests/bsim/sched/lead.sh b_fw/fw/zephyr/zephyr.exe 10 -40000 open >lead_open.txt 2>&1 &
          wait
          cat lead_*.txt
          for f in lead_371.txt lead_40000.txt lead_-40000.txt; do grep -q 'LEAD_CHECK.*closed skips=0 repeats=0 .*PASS' "$f"; done
          grep -q 'LEAD_CHECK.*open .*PASS' lead_open.txt
      - name: "receiver lock, tracking, merge, pack reboot (RX-2..RX-4, RX-10, #23)"
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: |
          export ZEPHYR_SDK_INSTALL_DIR="${ZEPHYR_SDK_INSTALL_DIR:-$(find /opt/toolchains -maxdepth 1 -name 'zephyr-sdk-*' | head -1)}"
          west build -p -b nrf5340bsim/nrf5340/cpuapp openpack/fw -d b_rx --sysbuild -- -DSB_CONFIG_OP_ROLE_RX=y
          west build -p -b nrf5340bsim/nrf5340/cpuapp openpack/fw -d b_pack3s --sysbuild -- \
            -Dfw_net_CONFIG_OP_PACK_TEST_RUN_MS=3000
          [ -x b_fw/fw/zephyr/zephyr.exe ] || west build -p -b nrf5340bsim/nrf5340/cpuapp openpack/fw -d b_fw --sysbuild
          openpack/tests/bsim/rx/run.sh b_fw/fw/zephyr/zephyr.exe b_rx/fw/zephyr/zephyr.exe a | tee rx_a.txt
          openpack/tests/bsim/rx/run.sh b_pack3s/fw/zephyr/zephyr.exe b_rx/fw/zephyr/zephyr.exe e | tee rx_e.txt
          grep -q 'RX_CHECK.*PASS' rx_a.txt
          grep -q 'RX_CHECK.*PASS' rx_e.txt

  g2:
    name: G2 scenarios
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    container:
      image: ghcr.io/zephyrproject-rtos/ci-repo-cache:v0.29.4.20260912
      options: --entrypoint /bin/bash
    env:
      ZEPHYR_TOOLCHAIN_VARIANT: zephyr
      BSIM_OUT_PATH: ${{ github.workspace }}/tools/bsim
      BSIM_COMPONENTS_PATH: ${{ github.workspace }}/tools/bsim/components
    steps:
      - uses: actions/checkout@v4
        with:
          path: openpack
      - uses: actions/cache@v4
        with:
          path: |
            zephyr
            modules
            bootloader
            tools
          key: west-${{ hashFiles('openpack/west.yml') }}
      - name: west update
        run: |
          git config --global --add safe.directory '*'
          [ -d .west ] || west init -l openpack
          west update --narrow -o=--depth=1
      - name: build BabbleSim
        working-directory: tools/bsim
        run: make everything -s -j4
      - name: "G2 scenarios a-e (SYS-2, SYS-3, RX-2, RX-7, RX-10), #27; nightly: (d) 1 h"
        timeout-minutes: 60
        env:
          G2_ARGS: ${{ github.event_name == 'schedule' && '--only d --d-secs 3600' || '' }}
        run: |
          export ZEPHYR_SDK_INSTALL_DIR="${ZEPHYR_SDK_INSTALL_DIR:-$(find /opt/toolchains -maxdepth 1 -name 'zephyr-sdk-*' | head -1)}"
          rc=0
          # shellcheck disable=SC2086 # G2_ARGS is a word list
          python3 openpack/tests/bsim/scenarios/run.py --jobs 4 --build g2-build --out g2-out $G2_ARGS || rc=$?
          [ -f g2-out/g2.md ] && cat g2-out/g2.md >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: g2-results
          path: |
            g2-out/g2.json
            g2-out/g2.md
            g2-build/*.build.log

  twister:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ghcr.io/zephyrproject-rtos/ci-repo-cache:v0.29.4.20260912
      options: --entrypoint /bin/bash
    env:
      ZEPHYR_TOOLCHAIN_VARIANT: zephyr
      BSIM_OUT_PATH: ${{ github.workspace }}/tools/bsim
      BSIM_COMPONENTS_PATH: ${{ github.workspace }}/tools/bsim/components
    steps:
      - uses: actions/checkout@v4
        with:
          path: openpack
      - uses: actions/cache@v4
        with:
          path: |
            zephyr
            modules
            bootloader
            tools
          key: west-${{ hashFiles('openpack/west.yml') }}
      - name: west update
        run: |
          git config --global --add safe.directory '*'
          [ -d .west ] || west init -l openpack
          west update --narrow -o=--depth=1
      - name: build BabbleSim
        working-directory: tools/bsim
        run: make everything -s -j4
      - name: twister fw/
        run: |
          export ZEPHYR_SDK_INSTALL_DIR="${ZEPHYR_SDK_INSTALL_DIR:-$(find /opt/toolchains -maxdepth 1 -name 'zephyr-sdk-*' | head -1)}"
          west twister -T openpack/fw -p native_sim -p nrf5340bsim/nrf5340/cpuapp -p nrf5340dk/nrf5340/cpuapp \
            -v --inline-logs --outdir twister-out
