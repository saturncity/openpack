# MCUboot serial recovery (FW-6, PK-9, #25 `dfu`): the app's `dfu` command sets the retained boot mode and resets;
# MCUboot then stays in the bootloader and speaks mcumgr SMP over the serial port until an image is uploaded.
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_BOOT_MODE=y
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y
# Leave recovery again if nobody talks to it: a mistyped `dfu` must not strand a pack until a power cycle.
CONFIG_BOOT_SERIAL_INACTIVITY_TIMEOUT=60000
# The serial adapter owns the UART: no MCUboot console on it.
CONFIG_UART_CONSOLE=n
# Size: the USB CDC build (pack) must fit the 64 kB MCUboot partition.
CONFIG_MCUBOOT_LOG_LEVEL_OFF=y
