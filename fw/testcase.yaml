common:
  tags: openpack
tests:
  # Runs: the role log line, on the host.
  fw.role.pack:
    platform_allow: native_sim
    harness: console
    harness_config:
      type: one_line
      regex:
        - "OpenPack role=pack"
  fw.role.rx:
    platform_allow: native_sim
    extra_args: CONFIG_OP_ROLE_RX=y
    harness: console
    harness_config:
      type: one_line
      regex:
        - "OpenPack role=rx"
  # Builds: FW-1 targets, both cores via sysbuild. DK builds add MCUboot (FW-6).
  fw.build.bsim.pack:
    platform_allow: nrf5340bsim/nrf5340/cpuapp
    sysbuild: true
    build_only: true
  fw.build.bsim.rx:
    platform_allow: nrf5340bsim/nrf5340/cpuapp
    sysbuild: true
    build_only: true
    extra_args: SB_CONFIG_OP_ROLE_RX=y
  fw.build.dk.pack:
    platform_allow: nrf5340dk/nrf5340/cpuapp
    sysbuild: true
    build_only: true
    extra_args: SB_CONFIG_BOOTLOADER_MCUBOOT=y
  fw.build.dk.rx:
    platform_allow: nrf5340dk/nrf5340/cpuapp
    sysbuild: true
    build_only: true
    extra_args:
      - SB_CONFIG_BOOTLOADER_MCUBOOT=y
      - SB_CONFIG_OP_ROLE_RX=y
  # Time diversity on at boot (ADR-0017): both cores, the 81 B schedule and RX-slot asserts.
  fw.build.dk.pack_td:
    platform_allow: nrf5340dk/nrf5340/cpuapp
    sysbuild: true
    build_only: true
    extra_args: SB_CONFIG_OP_TIME_DIVERSITY=y
